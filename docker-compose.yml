services:

  frontend:
    depends_on:
      - employee-backend
      - manager-backend
    build: ./web_app
    ports:
      - "5173:5173"

  employee-backend:
    build: ./employee_app
    image: employee-app
    ports:
      - "8080:8080"
    volumes:
      - "sqlite_data:/var/lib/sqlite/data"
    environment:
      DATABASE_URL: "/var/lib/sqlite/data/expenses_system_db.db"
      CONTAINER: "DOCKER"

  manager-backend:
    build: ./manager_app
    ports:
      - "9090:9090"
    volumes:
      - "sqlite_data:/var/lib/sqlite/data"
    environment:
      DATABASE_URL: "/var/lib/sqlite/data/expenses_system_db.db"
      CONTAINER: "DOCKER"

  selenium:
    image: selenium/standalone-chrome
    network_mode: host
    shm_size: 2gb

  manager-test:
    build:
      context: ./manager_app
      dockerfile: Dockerfile.test
    network_mode: host
    environment:
      HEADLESS: "true"
      SELENIUM_URL: "http://localhost:4444"
    profiles:
      - test

  employee-e2e:
    image: employee-app
    working_dir: /employee_app/e2e
    command: behave
    network_mode: host
    environment:
      HEADLESS: "true"
      SELENIUM_URL: "http://localhost:4444"
    profiles:
      - test

  jmeter-employee:
    build: ./employee_app/tests/jmeter
    network_mode: host
    command: ["-n", "-t", "/plan.jmx", "-l", "/tmp/employee-results.jtl"]
    profiles:
      - test

  jmeter-manager:
    build: ./manager_app/src/test/java/com/expense/manager/jmeter
    network_mode: host
    command: ["-n", "-t", "/plan.jmx", "-l", "/tmp/manager-results.jtl"]
    profiles:
      - test

volumes:
  sqlite_data:
